<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" width="660" height="330" font-family="system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="esArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <circle cx="330" cy="170" r="24" fill="#000" stroke="#8b949e"/>

  <!-- incoming star, stretched along the line to the hole -->
  <ellipse cx="140" cy="86" rx="46" ry="13" transform="rotate(26 140 86)" fill="#f0c674" opacity="0.9"/>
  <text x="112" y="52" fill="#8b949e">the star arrives, already stretched</text>

  <!-- the two halves -->
  <text x="196" y="130" fill="#f78166" font-size="12">near tip: lower energy</text>
  <path d="M 176 140 Q 280 168 330 194 Q 372 214 340 240" fill="none" stroke="#f78166" stroke-width="2.5" marker-end="url(#esArrow)"/>
  <text x="352" y="252" fill="#f78166" font-size="12">falls back, wraps, feeds the disc</text>

  <text x="196" y="112" fill="#58a6ff" font-size="12">far tip: higher energy</text>
  <path d="M 190 100 Q 380 96 630 40" fill="none" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#esArrow)"/>
  <text x="470" y="88" fill="#58a6ff" font-size="12">escapes for good</text>

  <line x1="60" y1="292" x2="600" y2="292" stroke="#8b949e" stroke-width="1"/>
  <line x1="330" y1="286" x2="330" y2="298" stroke="#8b949e" stroke-width="1"/>
  <text x="330" y="314" fill="#8b949e" text-anchor="middle" font-size="12">energy of the original orbit</text>
  <text x="150" y="314" fill="#f78166" text-anchor="middle" font-size="12">bound half</text>
  <text x="510" y="314" fill="#58a6ff" text-anchor="middle" font-size="12">unbound half</text>
  <path d="M 330 292 L 150 292" stroke="#f78166" stroke-width="3"/>
  <path d="M 330 292 L 510 292" stroke="#58a6ff" stroke-width="3"/>
</svg>
