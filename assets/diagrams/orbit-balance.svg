<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" width="620" height="320" font-family="system-ui, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f78166"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <circle cx="200" cy="160" r="110" fill="none" stroke="#8b949e" stroke-width="1" stroke-dasharray="4 5"/>
  <circle cx="200" cy="160" r="22" fill="#8b949e"/>
  <text x="200" y="205" fill="#8b949e" text-anchor="middle">central mass M</text>

  <circle cx="310" cy="160" r="9" fill="#58a6ff"/>
  <line x1="310" y1="160" x2="310" y2="72" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="322" y="80" fill="#58a6ff">speed v (sideways)</text>

  <line x1="310" y1="160" x2="236" y2="160" stroke="#f78166" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="248" y="150" fill="#f78166" text-anchor="end">pull</text>

  <text x="200" y="290" fill="#8b949e" text-anchor="middle" font-size="13">distance r</text>
  <line x1="200" y1="270" x2="310" y2="270" stroke="#8b949e" stroke-width="1"/>
  <line x1="200" y1="264" x2="200" y2="276" stroke="#8b949e" stroke-width="1"/>
  <line x1="310" y1="264" x2="310" y2="276" stroke="#8b949e" stroke-width="1"/>

  <text x="410" y="118" fill="#8b949e">The pull bends the path.</text>
  <text x="410" y="140" fill="#8b949e">Move sideways fast enough</text>
  <text x="410" y="162" fill="#8b949e">and the ground curves away</text>
  <text x="410" y="184" fill="#8b949e">as fast as you fall.</text>
  <text x="410" y="216" fill="#7ee787">That is an orbit.</text>
</svg>
