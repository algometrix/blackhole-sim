  <line x1="348" y1="162" x2="470" y2="96" stroke="#d2a8ff" stroke-width="0.8"/>
  <text x="476" y="94" fill="#d2a8ff" font-size="12">two holes, orbiting</text>
  <text x="12" y="28" fill="#8b949e">A spinning pair looks the same after half a turn, so the wave</text>
  <text x="12" y="48" fill="#8b949e">it makes repeats twice per orbit: two arms, not one.</text>
  <text x="12" y="314" fill="#8b949e">The ripples travel outward while the pair keeps turning, which winds</text>
  <text x="12" y="332" fill="#7ee787">the crests into a spiral. The height of each crest falls as 1/r.</text>
</svg>
